<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f5f6f5">
<title>押された回数</title>
<style>
  :root {
    --bg: #f5f6f5; --surface: #fff; --text: #1d2420; --muted: #67706b;
    --line: #dfe3e0; --accent: #1f6f4a; --accent-soft: #e9f2ed; --bar: #c9d6cf;
    --ease: cubic-bezier(0.19, 1, 0.22, 1);
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif; line-height: 1.6;
  }
  a { color: inherit; }
  main { max-width: 760px; margin: 0 auto; padding: 40px 16px 64px; }
  h1 { margin: 0; font-size: 26px; font-weight: 600; line-height: 1.2; }
  .lead { margin: 8px 0 0; font-size: 13px; color: var(--muted); }
  .sum { display: flex; gap: 36px; margin: 28px 0 32px; flex-wrap: wrap; }
  .sum div { font-size: 12px; color: var(--muted); }
  .sum b { display: block; font-size: 30px; line-height: 1.1; font-weight: 600; color: var(--text); font-variant-numeric: tabular-nums; }
  .sum div:first-child b { color: var(--accent); }
  .list { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
  .item { display: grid; grid-template-columns: 112px 1fr auto; gap: 16px; padding: 16px; border-top: 1px solid var(--line); align-items: start; }
  .item:first-child { border-top: 0; }
  .thumb { width: 112px; aspect-ratio: 16 / 9; border-radius: 4px; background: var(--bg); object-fit: cover; display: block; }
  .title { font-size: 14px; font-weight: 600; line-height: 1.45; text-decoration: none; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .title:hover { text-decoration: underline; }
  .meta { margin-top: 6px; font-size: 12px; color: var(--muted); }
  .meta span + span::before { content: "・"; }
  .bars { display: flex; align-items: flex-end; gap: 2px; height: 28px; margin-top: 10px; }
  .bars i { flex: 1; max-width: 10px; background: var(--bar); border-radius: 1px; min-height: 1px; transform-origin: bottom; animation: grow .9s var(--ease) both; }
  .bars i.today { background: var(--accent); }
  @keyframes grow { from { transform: scaleY(0); } }
  .num { text-align: right; font-size: 28px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }
  .num small { display: block; margin-top: 6px; font-size: 12px; font-weight: 400; color: var(--muted); }
  .empty { padding: 32px 16px; text-align: center; font-size: 14px; color: var(--muted); }
  .back { display: inline-block; margin-top: 24px; font-size: 13px; color: var(--muted); }
  @media (max-width: 520px) {
    .item { grid-template-columns: 88px 1fr; }
    .thumb { width: 88px; }
    .num { grid-column: 2; text-align: left; font-size: 22px; }
    .num small { display: inline; margin: 0 0 0 6px; }
    .sum { gap: 24px; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
<body>
<main>
  <h1>押された回数</h1>
  <p class="lead">go.lulinecast.jp で作ったリンクが押された回数。いいねと登録の数は YouTube Studio で見る</p>
  <div class="sum">
    <div><b id="today">–</b>今日</div>
    <div><b id="week">–</b>7日間</div>
    <div><b id="all">–</b>これまで</div>
  </div>
  <div class="list" id="list"><p class="empty">読み込んでいます</p></div>
  <a class="back" href="./">リンクを作る</a>
</main>
<script>
(function () {
  var DB = 'https://firestore.googleapis.com/v1/projects/applink-count-1119/databases/(default)/documents/hits?pageSize=300';
  var SRC = { instagram: 'Instagram', x: 'X', threads: 'Threads', facebook: 'Facebook', tiktok: 'TikTok', line: 'LINE', other: 'ブラウザ' };
  var OS = { ios: 'iPhone', android: 'Android', pc: 'パソコン' };
  function jst(offset) {
    return new Date(Date.now() + 9 * 3600e3 - offset * 864e5).toISOString().slice(0, 10).replace(/-/g, '');
  }
  var days = []; for (var i = 13; i >= 0; i--) days.push(jst(i));
  var today = days[13], week = days.slice(7);
  function n(v) { return v ? Number(v.integerValue || 0) : 0; }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

  fetch(DB).then(function (res) { return res.json(); }).then(function (data) {
    var docs = (data.documents || []).map(function (d) {
      var f = d.fields || {}, id = d.name.split('/').pop();
      return { id: id, f: f, total: n(f.total) };
    }).filter(function (d) { return !/^test/.test(d.id); })
      .sort(function (a, b) { return b.total - a.total; });

    var sT = 0, sW = 0, sA = 0;
    var list = document.getElementById('list'); list.innerHTML = '';
    if (!docs.length) { list.appendChild(el('p', 'empty', 'まだ押されていません')); }

    docs.forEach(function (d) {
      sA += d.total; sT += n(d.f['d' + today]);
      week.forEach(function (k) { sW += n(d.f['d' + k]); });

      var vid = /^y_/.test(d.id) ? d.id.slice(2) : null;
      var url = vid ? 'https://www.youtube.com/watch?v=' + vid : null;
      var row = el('div', 'item');
      var img = el('img', 'thumb'); img.alt = ''; img.loading = 'lazy';
      if (vid) img.src = 'https://i.ytimg.com/vi/' + vid + '/mqdefault.jpg';
      row.appendChild(img);

      var mid = el('div');
      var a = el('a', 'title', vid ? 'YouTube の動画' : d.id.slice(2)); if (url) { a.href = url; a.target = '_blank'; a.rel = 'noopener'; }
      mid.appendChild(a);
      if (vid) {
        fetch('https://www.youtube.com/oembed?format=json&url=' + encodeURIComponent(url))
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (j) { if (j && j.title) a.textContent = j.title; }).catch(function () {});
      }
      var meta = el('div', 'meta');
      Object.keys(SRC).forEach(function (k) { var c = n(d.f['s_' + k]); if (c) meta.appendChild(el('span', null, SRC[k] + ' ' + c)); });
      var os = el('div', 'meta');
      Object.keys(OS).forEach(function (k) { var c = n(d.f['o_' + k]); if (c) os.appendChild(el('span', null, OS[k] + ' ' + c)); });
      mid.appendChild(meta); mid.appendChild(os);

      var max = 1; days.forEach(function (k) { max = Math.max(max, n(d.f['d' + k])); });
      var bars = el('div', 'bars'); bars.setAttribute('aria-label', '14日間の押された回数');
      days.forEach(function (k, i) {
        var b = el('i', k === today ? 'today' : '');
        b.style.height = Math.round(n(d.f['d' + k]) / max * 100) + '%';
        b.style.animationDelay = (i * 25) + 'ms';
        b.title = k.slice(4, 6) + '/' + k.slice(6) + '　' + n(d.f['d' + k]) + '回';
        bars.appendChild(b);
      });
      mid.appendChild(bars);
      row.appendChild(mid);

      var num = el('div', 'num', d.total.toLocaleString());
      num.appendChild(el('small', null, '今日 ' + n(d.f['d' + today])));
      row.appendChild(num);
      list.appendChild(row);
    });
    document.getElementById('today').textContent = sT.toLocaleString();
    document.getElementById('week').textContent = sW.toLocaleString();
    document.getElementById('all').textContent = sA.toLocaleString();
  }).catch(function () {
    var list = document.getElementById('list'); list.innerHTML = '';
    list.appendChild(el('p', 'empty', '読み込めませんでした。少しして開き直してください'));
  });
})();
</script>
</body>
</html>
