<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f5f6f5">
<title>アプリで開くリンク</title>
<style>
  :root {
    --bg: #f5f6f5; --surface: #fff; --text: #1d2420; --muted: #67706b;
    --line: #dfe3e0; --accent: #1f6f4a; --accent-soft: #e9f2ed; --danger: #b42318;
    --ease: cubic-bezier(0.19, 1, 0.22, 1);
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; min-height: 100svh; background: var(--bg); color: var(--text);
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
    line-height: 1.6;
  }
  a { color: inherit; }

  /* 作る画面：箱ひとつ */
  #maker { max-width: 520px; margin: 0 auto; padding: 32px 16px; }
  .box { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px; }
  .box label { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 8px; }
  #src {
    width: 100%; font: inherit; font-size: 16px; color: var(--text);
    padding: 12px 14px; border: 1px solid var(--line); border-radius: 8px; background: #fff; outline: none;
    transition: border-color .4s var(--ease), box-shadow .4s var(--ease);
  }
  #src:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .err { margin: 10px 0 0; font-size: 13px; color: var(--danger); display: none; }

  #result { display: none; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--line); }
  #result.show { display: block; animation: in .6s var(--ease) both; }
  @keyframes in { from { opacity: 0; transform: translateY(6px); } }
  .row { display: flex; gap: 8px; align-items: stretch; }
  #out {
    flex: 1; min-width: 0; font-size: 14px; padding: 11px 12px; border-radius: 8px;
    background: var(--bg); color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    font: inherit; font-size: 15px; font-weight: 600; white-space: nowrap; text-decoration: none;
    padding: 0 18px; min-height: 44px; border-radius: 8px; border: 1px solid var(--accent);
    background: var(--accent); color: #fff; cursor: pointer; -webkit-tap-highlight-color: transparent;
    transition: transform .35s var(--ease), background .35s var(--ease);
  }
  .btn:active { transform: scale(.96); }
  .btn.done { background: var(--accent-soft); color: var(--accent); }
  .btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .kind { margin: 10px 0 0; font-size: 13px; color: var(--muted); }

  /* 押した人の画面：ロードだけ */
  #open { display: none; min-height: 100svh; align-items: center; justify-content: center; flex-direction: column; padding: 24px 16px; text-align: center; }
  .pop {
    font-family: ui-rounded, "SF Pro Rounded", "Hiragino Maru Gothic ProN", sans-serif;
    font-size: 56px; font-weight: 800; letter-spacing: -.04em; line-height: 1; color: var(--accent);
    animation: pop .7s var(--ease) both;
  }
  .pop i { display: inline-block; font-style: normal; animation: hop .9s .5s cubic-bezier(.3, 0, .2, 1) infinite; }
  @keyframes pop { 0% { transform: scale(.3); opacity: 0; } 60% { transform: scale(1.1); opacity: 1; } 100% { transform: scale(1); } }
  @keyframes hop { 0%, 100% { transform: translateY(0); } 40% { transform: translateY(-16px); } }
  #openTitle { margin: 18px 0 0; font-size: 15px; font-weight: 600; }
  #openLead { margin: 4px 0 0; font-size: 13px; color: var(--muted); }
  #openBtns { display: none; margin-top: 22px; width: 100%; max-width: 320px; }
  #openBtns.show { display: block; animation: in .6s var(--ease) both; }
  #openBtns .btn { width: 100%; }
  #openBtns .alt { display: block; margin-top: 12px; font-size: 13px; color: var(--muted); }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>

<section id="maker">
  <div class="box">
    <label for="src">リンクを貼る</label>
    <input id="src" type="url" inputmode="url" placeholder="https://youtu.be/…" autocomplete="off">
    <p class="err" id="err">作れるのは YouTube・Instagram・X・Amazon・TikTok・LINE と、自社サイトのリンクです。</p>
    <div id="result">
      <div class="row">
        <div id="out"></div>
        <button class="btn" id="copy" type="button">
          <svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg>
          <span>コピー</span>
        </button>
      </div>
      <p class="kind" id="kind"></p>
    </div>
  </div>
</section>

<section id="open">
  <div class="pop" aria-hidden="true">go<i>.</i></div>
  <p id="openTitle">開いています</p>
  <p id="openLead"></p>
  <div id="openBtns">
    <a class="btn" id="appBtn">アプリで開く</a>
    <a class="alt" id="safariBtn" style="display:none">Safari を通して開く</a>
    <a class="alt" id="webBtn">ブラウザで開く</a>
  </div>
</section>

<script>
(function () {
  var ua = navigator.userAgent;
  var isIOS = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  var isAndroid = /Android/.test(ua);
  var inLine = /\bLine\//i.test(ua);
  var inTikTok = /BytedanceWebview|musical_ly|TikTok/i.test(ua);
  var inOtherApp = /Instagram|FBAN|FBAV|FB_IAB|BytedanceWebview|musical_ly|TikTok|Twitter/i.test(ua);

  var OWN_SITES = /(^|\.)(lulinecast\.jp|nakamuradental\.jp|forever-young\.jp)$/;
  function $(id) { return document.getElementById(id); }

  // 開きたい URL を、どのアプリでどう開くかに変える
  function plan(raw) {
    var u;
    try { u = new URL(raw); } catch (e) { return null; }
    if (!/^https?:$/.test(u.protocol)) return null;
    var host = u.hostname.replace(/^(www\.|m\.|mobile\.)/, '');
    var path = u.pathname, seg = path.split('/').filter(Boolean);
    var r = { web: u.href, name: null, ios: null, pkg: null, aPath: u.host + u.pathname + u.search };

    if (host === 'youtube.com' || host === 'youtu.be') {
      r.name = 'YouTube'; r.pkg = 'com.google.android.youtube';
      r.vid = host === 'youtu.be' ? seg[0]
        : (u.searchParams.get('v') || ((seg[0] === 'shorts' || seg[0] === 'live') ? seg[1] : null));
      var p = host === 'youtu.be' ? '/watch?v=' + seg[0] : path + u.search;
      // URLgenius と同じく iPhone・Android とも vnd.youtube:// で開く
      r.ios = r.android = 'vnd.youtube://www.youtube.com' + p;
      r.aPath = 'www.youtube.com' + p;
    } else if (host === 'instagram.com') {
      r.name = 'Instagram'; r.pkg = 'com.instagram.android';
      if (seg.length === 1) r.ios = 'instagram://user?username=' + encodeURIComponent(seg[0]);
    } else if (host === 'x.com' || host === 'twitter.com') {
      r.name = 'X'; r.pkg = 'com.twitter.android';
      if (seg[1] === 'status' && seg[2]) r.ios = 'twitter://status?id=' + seg[2];
      else if (seg.length === 1) r.ios = 'twitter://user?screen_name=' + encodeURIComponent(seg[0]);
    } else if (/(^|\.)amazon\.co\.jp$|(^|\.)amazon\.com$|^amzn\.(asia|to)$/.test(host)) {
      r.name = 'Amazon'; r.pkg = 'com.amazon.mShop.android.shopping';
      r.ios = 'com.amazon.mobile.shopping.web://' + u.host + u.pathname + u.search;
    } else if (host === 'tiktok.com' || /\.tiktok\.com$/.test(host)) {
      r.name = 'TikTok'; r.pkg = 'com.zhiliaoapp.musically';
    } else if (host === 'line.me' || host === 'lin.ee') {
      r.name = 'LINE'; r.pkg = 'jp.naver.line.android';
    }
    // 悪用されないよう、飛び先は上のアプリと自社のサイトだけにする
    if (!r.name && !OWN_SITES.test(host)) return null;
    return r;
  }

  function androidIntent(r, pkg) {
    return 'intent://' + r.aPath + '#Intent;scheme=https;' + (pkg ? 'package=' + pkg + ';' : '') +
      'S.browser_fallback_url=' + encodeURIComponent(r.web) + ';end';
  }

  var params = new URLSearchParams(location.search);
  var target = params.get('u');
  // YouTube 用の短い形 ?y=動画ID
  if (!target && /^[\w-]{6,20}$/.test(params.get('y') || '')) target = 'https://www.youtube.com/watch?v=' + params.get('y');

  if (target) {
    $('maker').style.display = 'none';
    $('open').style.display = 'flex';
    var r = plan(target);
    if (!r) {
      document.querySelector('.pop').style.display = 'none';
      $('openTitle').textContent = 'このリンクは開けません';
      $('openLead').textContent = '作った人にリンクを確かめてもらってください';
      return;
    }

    // LINE の中なら、まず普段のブラウザに出す（LINE が対応している公式の方法）
    // YouTube は URLgenius と同じく LINE の中からも直接アプリを開く
    if (inLine && !r.vid && r.name !== 'YouTube' && !params.has('openExternalBrowser')) {
      location.replace(location.href + '&openExternalBrowser=1');
      return;
    }

    var app = null;
    if (isAndroid) {
      // アプリが無ければ Chrome、それも無ければ元のページへ
      app = r.android || androidIntent(r, r.pkg || (inOtherApp ? 'com.android.chrome' : null));
      if (!r.android && !r.pkg && !inOtherApp) app = null;
      // YouTube は URLgenius と同じ使い分け：Chrome・LINE は intent、Facebook は一度 Chrome へ、他のアプリ内は vnd.youtube
      if (r.android) {
        var inFB = /FBAN|FBAV|FB_IAB/.test(ua);
        if (inFB) app = 'intent://' + location.host + location.pathname + location.search + '#Intent;scheme=https;package=com.android.chrome;end';
        else if (!inOtherApp) app = androidIntent(r, r.pkg);
      }
    } else if (isIOS) {
      // URLgenius と同じく、TikTok の中からは一度 Safari に出してからアプリを開く
      if (r.ios && inTikTok) app = 'x-safari-' + location.href;
      else if (r.ios) app = r.ios;
      else if (inOtherApp) app = 'x-safari-' + r.web; // Instagram などの中から Safari に出す
    }

    $('openTitle').textContent = r.name ? r.name + ' を開いています' : 'ブラウザを開いています';
    $('webBtn').href = r.web;
    var appBtn = $('appBtn');
    appBtn.textContent = r.name ? r.name + ' アプリで開く' : 'ブラウザで開く';
    if (app) appBtn.href = app; else appBtn.style.display = 'none';

    if (!app) { location.replace(r.web); return; }

    // Instagram などのアプリの中では Web に切り替えず、押せるボタンを残す
    var inInApp = inLine || inOtherApp;
    if (r.name === 'YouTube' && isIOS && inInApp && !inTikTok) {
      var sb = $('safariBtn');
      sb.href = 'x-safari-' + location.href;
      sb.style.display = 'block';
    }

    function showButtons() {
      $('openLead').textContent = '開かない時は下のボタンを押してください';
      $('openBtns').className = 'show';
    }

    // 画面の確認用：&preview を付けると開かずに画面だけ見せる
    if (params.has('preview')) {
      if (params.get('preview') === 'buttons') {
        if (!isAndroid) $('safariBtn').style.display = 'block';
        showButtons();
      }
      return;
    }

    var left = false, start = Date.now();
    document.addEventListener('visibilitychange', function () { if (document.hidden) left = true; });
    location.href = app;
    // アプリの外では URLgenius と同じく、すぐ戻ってきた＝アプリが無いとみて Web のページへ
    if (r.name === 'YouTube' && !inInApp && app.indexOf('x-safari-') !== 0) {
      setTimeout(function () {
        if (!left && !document.hidden && Date.now() - start < 5000) location.replace(r.web);
      }, 1000);
    }
    // 開けなかった時だけ、少ししてボタンを出す
    setTimeout(function () { if (!left) showButtons(); }, 1500);
    return;
  }

  // 作る画面：貼ったらすぐリンクができる
  var src = $('src');
  function make() {
    var v = src.value.trim();
    if (v && !/^https?:\/\//i.test(v)) v = 'https://' + v;
    var r = v ? plan(v) : null;
    var res = $('result');
    $('err').style.display = v && !r ? 'block' : 'none';
    if (!r) { res.className = ''; return; }
    var base = location.origin + location.pathname;
    var link = r.vid && /^[\w-]{6,20}$/.test(r.vid) && !r.web.match(/\/shorts\//)
      ? base + '?y=' + r.vid
      : base + '?u=' + encodeURIComponent(r.web);
    if ($('out').textContent === link && res.className === 'show') return;
    $('out').textContent = link;
    $('kind').textContent = r.name
      ? 'スマホでは ' + r.name + ' アプリで開きます'
      : 'アプリの中で押されても、普段のブラウザで開きます';
    res.className = ''; void res.offsetWidth; res.className = 'show';
  }
  src.addEventListener('input', make);
  src.addEventListener('paste', function () { setTimeout(make, 0); });
  $('copy').addEventListener('click', function () {
    var b = this, s = b.querySelector('span');
    navigator.clipboard.writeText($('out').textContent).then(function () {
      s.textContent = 'コピーしました'; b.classList.add('done');
      setTimeout(function () { s.textContent = 'コピー'; b.classList.remove('done'); }, 1600);
    });
  });
})();
</script>
</body>
</html>
